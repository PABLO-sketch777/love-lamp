<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pull the Cord ❤️</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main id="scene">

     <h1 id="loveText" class="heart-only">

    <span class="letter letter-i">
        I
    </span>

    <span class="heart">
        ♥
    </span>

    <span class="letter letter-u">
        U
    </span>

</h1>

        <p id="subtitle">
            Pull the cord to reveal the surprise.
        </p>


        <!-- LAMP -->

        <div class="lamp-container">

            <div class="lamp">

                <div class="lamp-top"></div>

                <div class="bulb">
                    <div class="bulb-highlight"></div>
                </div>

                <div class="lamp-base"></div>

            </div>


            <!-- PULL CORD -->

            <div
                id="pullSwitch"
                class="cord"
                role="button"
                tabindex="0"
            >

                <div class="cord-line"></div>

                <div class="cord-handle"></div>

            </div>

            <p id="hint">
                Pull the cord to switch on
            </p>

        </div>


        <!-- PARTICLES -->

        <div id="particles"></div>


        <footer>
            FROM  ME TO YOU ❤️
        </footer>

    </main>


    <script src="script.js"></script>

</body>

</html>
